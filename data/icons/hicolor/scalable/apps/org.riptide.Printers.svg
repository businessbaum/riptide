<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Drucker: a printer on a light grey rounded square, a sheet coming out, like on macOS -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#d8d8de"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e76"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#bg)"/>
  <!-- paper going in at the back -->
  <rect x="38" y="20" width="52" height="34" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <!-- body -->
  <rect x="20" y="46" width="88" height="42" rx="10" fill="url(#body)"/>
  <circle cx="92" cy="60" r="4" fill="#30d158"/>
  <!-- the printed sheet -->
  <rect x="36" y="74" width="56" height="36" rx="3" fill="#ffffff" stroke="#c7c7cc" stroke-width="2"/>
  <g stroke="#0a84ff" stroke-width="4" stroke-linecap="round">
    <line x1="46" y1="86" x2="82" y2="86"/>
    <line x1="46" y1="96" x2="72" y2="96"/>
  </g>
</svg>
