# Which program answers which portal (xdg-desktop-portal, docs/os-plan.md):
#   screen sharing, screenshots: hyprland (captures; our picker decides, hypr/xdph.conf)
#   questions (Access: camera, background, …) and background/autostart: riptide – our
#   session service, so they appear in the system's own dialog
#   which app opens what an app hands out (AppChooser): riptide – the default app, no
#   question; gtk (its chooser dialog) only while riptide.portal does not offer it yet
#   everything else (file dialogs, settings): hyprland, then gtk
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Access=riptide
org.freedesktop.impl.portal.Background=riptide
org.freedesktop.impl.portal.AppChooser=riptide;gtk
