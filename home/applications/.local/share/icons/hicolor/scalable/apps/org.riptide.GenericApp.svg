<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Stand-in for apps without an icon, like the generic app icon on macOS:
       a light grey rounded square with a simple window outline -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f5"/>
      <stop offset="1" stop-color="#cfcfd6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect x="26" y="34" width="76" height="60" rx="9" fill="#ffffff" stroke="#8e8e96" stroke-width="4"/>
  <line x1="26" y1="50" x2="102" y2="50" stroke="#8e8e96" stroke-width="4"/>
  <circle cx="36" cy="42" r="3" fill="#ff5f57"/>
  <circle cx="45" cy="42" r="3" fill="#febc2e"/>
  <circle cx="54" cy="42" r="3" fill="#28c840"/>
</svg>
