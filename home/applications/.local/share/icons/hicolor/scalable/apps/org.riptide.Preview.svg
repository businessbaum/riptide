<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vorschau: magnifying glass on a blue tile (style of macOS app icons) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#0a64d8"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#tile)"/>
  <circle cx="226" cy="222" r="96" fill="none" stroke="#fff" stroke-width="36"/>
  <line x1="296" y1="292" x2="370" y2="366" stroke="#fff" stroke-width="44" stroke-linecap="round"/>
</svg>
