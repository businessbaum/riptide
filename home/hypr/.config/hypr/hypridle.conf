# Idle behaviour (hypridle, started as a systemd user service with the session):
#   10 min idle → lock screen, 12 min → screens off, any input → screens on.
# No automatic suspend yet (NVIDIA suspend not tested on this machine).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false   # videos and calls keep the screen on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
