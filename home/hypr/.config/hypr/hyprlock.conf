# Lock screen in the style of macOS (⌃⌘Q / SUPER+L).
# Colours are fixed here for now; the theme generator takes over in stage 2.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, darkened picture of the desktop
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

# Date on top, the large time below it, like macOS Sonoma
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %-d. %B"
    font_family = Inter Semi Bold
    font_size = 22
    color = rgba(255, 255, 255, 0.85)
    position = 0, -110
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    font_family = Inter Bold
    font_size = 110
    color = rgba(255, 255, 255, 0.92)
    position = 0, -150
    halign = center
    valign = top
}

# User name and password field at the bottom
label {
    monitor =
    text = $USER
    font_family = Inter Semi Bold
    font_size = 15
    color = rgba(255, 255, 255, 0.9)
    position = 0, 190
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 260, 40
    rounding = 20
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 0.30)
    fail_color = rgba(255, 69, 58, 0.45)
    placeholder_text = <span foreground="##ffffffaa">Passwort eingeben</span>
    fail_text = <span foreground="##ffffffdd">Falsches Passwort</span>
    fade_on_empty = false
    dots_center = true
    position = 0, 130
    halign = center
    valign = bottom
}
