# Terminal in the style of the macOS Terminal

# DejaVu Sans Mono is the font Apple's "Menlo" was derived from
font_family      DejaVu Sans Mono
font_size        12.5

# Start size like on a Mac (columns x rows)
remember_window_size  no
initial_window_width  100c
initial_window_height 30c
window_padding_width  6 10

# Slightly translucent; Hyprland blurs what is behind it
background_opacity 0.94
confirm_os_window_close 0

# Tabs at the top, plain
tab_bar_edge  top
tab_bar_style separator
tab_separator " │ "

cursor_shape          block
cursor_blink_interval 0.5

# Colours (light/dark) come from the theme, generated by desktop-theme
# (a missing file is ignored silently, e.g. before the first run)
include ~/.local/state/desktop-theme/kitty.conf

# ⌘ shortcuts (Hyprland passes them to kitty unchanged, see modules/keys.lua)
map super+c     copy_to_clipboard
map super+v     paste_from_clipboard
map super+t     new_tab
map super+w     close_tab
map super+n     new_os_window
map super+k     clear_terminal to_cursor active
map super+plus  change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0     change_font_size all 0
map super+1     goto_tab 1
map super+2     goto_tab 2
map super+3     goto_tab 3
map super+4     goto_tab 4
map super+5     goto_tab 5
map super+6     goto_tab 6
map super+7     goto_tab 7
map super+8     goto_tab 8
map super+9     goto_tab 9

# Also ⌃C / ⌃V like on Windows:
# ⌃C copies when text is selected – otherwise it interrupts the program as usual.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
