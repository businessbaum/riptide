# Apps started as services (login items: app-<name>@autostart.service from
# ~/.config/autostart) wait for the password: at boot the session starts locked
# (Quickshell Lock.qml); after the password the shell starts xdg-desktop-autostart.target
# again and they open. (A condition on the target would not do: its apps are queued anyway.)
[Service]
ExecCondition=/bin/sh -c '! test -e "%t/riptide/start-locked"'
