# Night Shift (NightShift.qml) switches the colours through hyprsunset's IPC
# (hyprctl hyprsunset temperature … / identity), on a schedule or by hand. Without it,
# the screens stay true to colour: start neutral, not at hyprsunset's default 6000 K.
[Service]
ExecStart=
ExecStart=/usr/bin/hyprsunset --identity
