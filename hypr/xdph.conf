# xdg-desktop-portal-hyprland (screen sharing): it captures, we decide.
# Our picker asks the session service (permission "screen", our dialog in the shell);
# no restore tokens, so no app can share again without the dialog.
screencopy {
    custom_picker_binary = /home/user/.local/bin/riptide-share-picker
    allow_token_by_default = false
}
