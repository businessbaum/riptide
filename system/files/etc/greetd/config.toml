# greetd: riptide's login screen (installed by system/setup-os.sh, step "Anmeldebildschirm").
# The greeter runs as the unprivileged user "greeter"; after a successful login greetd starts
# the session (uwsm → Hyprland) as that user.
[terminal]
vt = 1

[default_session]
command = "/usr/local/lib/riptide/greeter/start"
user = "greeter"
