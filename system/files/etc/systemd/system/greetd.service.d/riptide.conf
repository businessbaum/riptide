# riptide: after a logout the next session starts locked, as at boot – greetd's initial
# session runs again only without its runfile (/usr/local/lib/riptide/greeter/relock).
# "-": whatever happens there, greetd starts (the login screen is never at stake).
[Service]
ExecStartPre=-/usr/local/lib/riptide/greeter/relock
